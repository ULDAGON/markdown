<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown.</title>
<link rel="icon" href="assets/mark.svg" type="image/svg+xml">
<script>
  // Set the theme before the first paint. Dark is the ULDAGON default.
  try {
    const saved = localStorage.getItem("theme");
    if (saved) document.documentElement.dataset.theme = saved;
  } catch {}
</script>
<link rel="stylesheet" href="css/uldagon.css">
<link rel="stylesheet" href="css/app.css">
<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="vendor/turndown.js"></script>
<script src="vendor/turndown-plugin-gfm.js"></script>
<script type="module" src="js/app.js"></script>
</head>
<body>

<header class="top">
  <svg class="mark" viewBox="100 100 1800 1722" role="img" aria-label="ULDAGON">
    <path d="M 631.54,1821.12 A 900.0,900.0 0 1 1 1368.46,1821.12 L 1368.46,1474.09 A 694.63,694.63 0 1 0 631.54,1474.09 Z"/>
    <circle cx="1000" cy="885.23" r="368.46"/>
  </svg>
  <h1 class="title">Markdown<span class="dot">.</span></h1>
  <button class="switch" id="theme" role="switch" aria-checked="true" aria-label="dark mode"></button>
</header>

<div class="actions">
  <div class="row">
    <button class="btn" id="import">import</button>
    <button class="btn" id="clear">clear</button>
    <input type="file" id="file" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden>
  </div>
  <div class="row">
    <input class="field" id="name" spellcheck="false" autocomplete="off" aria-label="file name" placeholder="untitled.md">
    <button class="btn primary" id="download">download</button>
  </div>
</div>

<main class="panes">
  <section class="card" id="source-card" aria-label="markdown">
    <div class="toolbar" id="source-tools"></div>
    <textarea id="source" spellcheck="false" placeholder="type markdown."></textarea>
  </section>
  <section class="card" aria-label="preview">
    <div class="toolbar" id="preview-tools"></div>
    <article class="prose" id="preview" contenteditable="true" spellcheck="false"></article>
  </section>
</main>

<footer class="status">
  <span class="num" id="stats"></span>
  <span class="keys" id="note"></span>
</footer>

</body>
</html>
